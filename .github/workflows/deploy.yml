name: deploy

# Push to master → build the Docusaurus static site → publish to Cloudflare
# Pages (project `subfrost-docs`, custom domain docs.subfrost.io). This replaced
# the old chain (Cloud Build → Artifact Registry image → Flux/GKE); the docs are
# now static files served straight from Cloudflare's edge — no container, no
# cluster, no Cloud Run.
#
# Secrets (repo settings):
#   CLOUDFLARE_API_TOKEN   token scoped to Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  d1a33b867f4cb065139e5172a65f6c51 (Subzeroresearchltd)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name subfrost-docs --branch master --commit-dirty=true
