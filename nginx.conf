server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The pod listens on 8080 behind Cloudflare. Without this, the trailing-slash
    # 301 from try_files $uri/ is built from the listen socket and leaks the
    # internal scheme+port: http://docs.subfrost.io:8080/start-here/... . Browsers
    # in HTTPS-first mode then upgrade that to https on :8080, where the Cloudflare
    # edge speaks plaintext, and the user gets ERR_SSL_PROTOCOL_ERROR. Relative
    # redirects inherit the caller's real scheme and port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Docusaurus emits content-hashed assets under /assets/ — safe to pin forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML entry points must not be cached, otherwise the browser keeps loading
    # stale chunk references after a deploy.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Docusaurus pre-renders one file per route — no SPA fallback to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}
